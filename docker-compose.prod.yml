# Servidor: 8 vCPU / 24 GB RAM, dedicado a este projeto.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# O tuning do PostgreSQL NÃO fica aqui: está em .docker/postgres/postgresql.conf,
# montado pelo compose base, para valer mesmo se a subida for sem este overlay.
# Este arquivo cuida apenas de teto de CPU e memória por container.
#
# Orçamento de memória (limites):
#   postgres 14G | php 2G | worker 3×1G | redis-contratacoes 768M
#   pca-worker 4×1G | redis-pca 768M | nginx + 2 schedulers ~0.75G
#   ≈ 25G de TETO somado (acima dos 24G de propósito). São limites, não
#   reservas: o uso real é pequeno (cada worker ~50 MB, postgres ~1,5 GB em
#   repouso), então o sistema operacional segue com folga.
#
# Os tetos de CPU somam mais que 8 de propósito: são limites, não reservas.
# Assim cada serviço aproveita a capacidade ociosa sem que um sozinho
# monopolize a máquina.

services:
  nginx:
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          memory: 64M

  php:
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 2G
        reservations:
          memory: 512M

  worker: &worker-resources
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          memory: 256M

  worker-2:
    <<: *worker-resources

  worker-3:
    <<: *worker-resources

  scheduler:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  pca-scheduler:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  pca-worker: &pca-worker-resources
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          memory: 256M

  pca-worker-2:
    <<: *pca-worker-resources

  pca-worker-3:
    <<: *pca-worker-resources

  pca-worker-4:
    <<: *pca-worker-resources

  postgres:
    deploy:
      resources:
        limits:
          # Era "2.00": esse teto sozinho anulava qualquer paralelismo, por mais
          # workers que o postgresql.conf autorizasse.
          cpus: "6.00"
          # Precisa acomodar shared_buffers (6G) + work_mem por conexão + o
          # cache de página. Estourar o limite significa OOM kill do banco.
          memory: 14G
        reservations:
          memory: 8G

  redis-contratacoes: &redis-resources
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definida no .env da raiz do projeto (ao lado do docker-compose.yml)}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 128M

  redis-pca:
    <<: *redis-resources
