# Servidor: 8 vCPU / 24 GB RAM, dedicado a este projeto.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# O tuning do PostgreSQL NÃO fica aqui: está em .docker/postgres/postgresql.conf,
# montado pelo compose base, para valer mesmo se a subida for sem este overlay.
# Este arquivo cuida apenas de teto de CPU e memória por container.
#
# Orçamento de memória (limites):
#   postgres 14G | php 2.5G | worker 3×1.5G | redis 1.5G | nginx+scheduler 0.5G
#   = 23G, deixando ~1G para o sistema operacional.
#
# Os tetos de CPU somam mais que 8 de propósito: são limites, não reservas.
# Assim cada serviço aproveita a capacidade ociosa sem que um sozinho
# monopolize a máquina.

services:
  nginx:
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          memory: 64M

  php:
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 2560M
        reservations:
          memory: 512M

  worker: &worker-resources
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M
        reservations:
          memory: 256M

  worker-2:
    <<: *worker-resources

  worker-3:
    <<: *worker-resources

  scheduler:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  postgres:
    deploy:
      resources:
        limits:
          # Era "2.00": esse teto sozinho anulava qualquer paralelismo, por mais
          # workers que o postgresql.conf autorizasse.
          cpus: "6.00"
          # Precisa acomodar shared_buffers (6G) + work_mem por conexão + o
          # cache de página. Estourar o limite significa OOM kill do banco.
          memory: 14G
        reservations:
          memory: 8G

  redis:
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
        reservations:
          memory: 256M
