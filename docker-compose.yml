x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-php-app: &php-app
  build:
    context: .
    dockerfile: .docker/php/Dockerfile
  volumes:
    - ./contratacoes:/var/www/html
    - ./pca:/opt/pca:ro
    - ./.docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    - ./.docker/php/zz-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-fpm-tuning.conf
  networks:
    - app-network
  restart: unless-stopped
  logging: *default-logging

x-worker: &worker
  <<: *php-app
  command: php -d memory_limit=512M artisan queue:work redis --sleep=3 --tries=5 --timeout=900 --memory=512 --max-jobs=50 --max-time=3600
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis-contratacoes:
      condition: service_healthy

x-pca-app: &pca-app
  <<: *php-app
  volumes:
    - ./pca:/var/www/html
    - ./contratacoes:/opt/contratacoes:ro
    - ./.docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    - ./.docker/php/zz-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-fpm-tuning.conf

x-pca-worker: &pca-worker
  <<: *pca-app
  command: php -d memory_limit=512M artisan queue:work redis --sleep=3 --tries=5 --timeout=900 --memory=512 --max-jobs=50 --max-time=3600
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis-pca:
      condition: service_healthy

x-redis: &redis
  image: redis:alpine
  command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definida no .env da raiz do projeto (ao lado do docker-compose.yml)}
  networks:
    - app-network
  restart: unless-stopped
  logging: *default-logging
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
    interval: 10s
    timeout: 3s
    retries: 5
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definida no .env da raiz do projeto (ao lado do docker-compose.yml)}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./contratacoes:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging

  php:
    <<: *php-app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis-contratacoes:
        condition: service_healthy

  worker:
    <<: *worker
  worker-2:
    <<: *worker
  worker-3:
    <<: *worker

  scheduler:
    <<: *php-app
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis-contratacoes:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    ports:
      # Só escuta em 127.0.0.1 do host: não é alcançável pela internet.
      # Acesso externo (DBeaver etc.) via túnel SSH — ver instruções no chat.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: pncp
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD precisa estar definida no .env da raiz do projeto (ao lado do docker-compose.yml)}
    # O tuning fica no compose base (e não no overlay de produção) para valer
    # tanto em `docker compose up` quanto com o -f docker-compose.prod.yml.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./.docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # /dev/shm é onde os workers paralelos trocam dados. Com 4 workers por
    # query, os 256mb anteriores viravam teto de paralelismo.
    shm_size: 2gb
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pncp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-contratacoes:
    <<: *redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-contratacoes-data:/data

  redis-pca:
    <<: *redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-pca-data:/data

  pca-scheduler:
    <<: *pca-app
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis-pca:
        condition: service_healthy

  pca-worker:
    <<: *pca-worker
  pca-worker-2:
    <<: *pca-worker

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-contratacoes-data:
  redis-pca-data:
