x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-php-app: &php-app
  build:
    context: .
    dockerfile: .docker/php/Dockerfile
  volumes:
    - ./backend:/var/www/html
    - ./.docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    - ./.docker/php/zz-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-fpm-tuning.conf
  networks:
    - app-network
  restart: unless-stopped
  logging: *default-logging

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging

  php:
    <<: *php-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *php-app
    command: php -d memory_limit=512M artisan queue:work redis --sleep=3 --tries=5 --timeout=600 --memory=512 --max-jobs=50 --max-time=3600
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *php-app
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: manipulate_data
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d manipulate_data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
