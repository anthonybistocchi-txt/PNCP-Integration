server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;

    client_max_body_size 32M;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Docker DNS: re-resolve o serviço php se o container for recriado
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Monitoramento do pool do PHP-FPM (pm.max_children, requests ativos).
#
# Escuta numa porta separada que NÃO é publicada em docker-compose.yml
# (nenhum "8081:8081" nos ports do serviço nginx). Isso a torna inatingível
# de fora por construção — não depende de lista de IP, que falha aqui porque
# o gateway do Docker cai dentro de faixas privadas comuns e não se distingue
# de tráfego interno depois do NAT.
#
# Uso: docker compose exec nginx wget -qO- http://127.0.0.1:8081/fpm-status
server {
    listen 8081;
    server_name localhost;

    location ~ ^/(fpm-status|fpm-ping)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location / {
        return 404;
    }
}
