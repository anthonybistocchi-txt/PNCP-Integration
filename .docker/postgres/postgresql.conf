#------------------------------------------------------------------------------
# PostgreSQL 15 - PNCP Integration
#
# Perfil: 8 vCPU / 24 GB RAM, servidor dedicado a este projeto,
# carga predominante de LEITURA (API de listagem) com uma janela diária de
# escrita (sync do PNCP, upsert em lote).
#
# Este arquivo substitui o postgresql.conf padrão da imagem. Parâmetros não
# listados aqui continuam com o default de fábrica do PostgreSQL.
#
# Para reduzir em uma máquina menor (notebook), crie um arquivo em
# .docker/postgres/local.conf e monte-o em /etc/postgresql/local.conf:
# ele é incluído no fim e sobrescreve o que estiver aqui.
#------------------------------------------------------------------------------

# Sem isso o PostgreSQL escuta apenas em localhost e nenhum container alcança o banco.
listen_addresses = '*'

# 24 conexões dão conta do php-fpm + workers + scheduler. O resto é folga para
# migrations, psql e picos. Cada conexão reserva memória, então não vale inflar.
max_connections = 100


#------------------------------------------------------------------------------
# MEMÓRIA
#------------------------------------------------------------------------------

# ~25% da RAM. É o cache de páginas do próprio PostgreSQL: com a tabela quente
# aqui dentro, a leitura não toca o disco.
shared_buffers = 6GB

# Não aloca nada: é a estimativa que o planejador usa do total de cache
# disponível (shared_buffers + page cache do SO). Estimar alto faz o
# planejador preferir index scan a seq scan.
effective_cache_size = 16GB

# Por operação de sort/hash, por worker paralelo. Uma query com 4 workers e um
# sort pode usar 5 x 32MB. Subir demais com muitas conexões estoura a RAM.
work_mem = 32MB

# VACUUM, CREATE INDEX e REINDEX. Vale ser generoso: só um punhado de
# operações usa isso por vez.
maintenance_work_mem = 1GB

# Limita cada worker de autovacuum, que senão herdaria maintenance_work_mem
# inteiro (3 workers x 1GB simultâneos).
autovacuum_work_mem = 512MB


#------------------------------------------------------------------------------
# PARALELISMO
#
# É aqui que estava o gargalo dos "2 núcleos": com
# max_parallel_workers_per_gather=2 uma query grande usa no máximo 3 núcleos
# (2 workers + o processo líder), independentemente de quantos a máquina tem.
#------------------------------------------------------------------------------

max_worker_processes = 8
max_parallel_workers = 8

# 4 workers + líder = até 5 núcleos numa única query pesada, sobrando 3 para o
# resto da aplicação.
max_parallel_workers_per_gather = 4

# Acelera CREATE INDEX e VACUUM, que hoje rodam em série.
max_parallel_maintenance_workers = 4

# Defaults (1000 e 0.1) foram calibrados para hardware antigo e fazem o
# planejador descartar plano paralelo em tabelas médias. Baixar faz o
# paralelismo ser escolhido com mais frequência.
parallel_setup_cost = 500
parallel_tuple_cost = 0.05

min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB


#------------------------------------------------------------------------------
# PLANEJADOR E I/O (assume disco SSD/NVMe)
#------------------------------------------------------------------------------

# O default 4.0 pressupõe disco mecânico e empurra o planejador para seq scan.
# Em SSD o acesso aleatório custa quase o mesmo que o sequencial.
random_page_cost = 1.1
seq_page_cost = 1.0

effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Mais amostras por coluna: planos melhores em colunas com distribuição
# desigual, como uf e codigo_modalidade_contratacao.
default_statistics_target = 200

# Compilar a query custa 50-300ms e só compensa em consultas analíticas longas.
# O padrão aqui é index scan, count e full-text search, onde o JIT só atrapalha.
jit = off

# Evita transação aberta esquecida segurando lock e travando o autovacuum.
idle_in_transaction_session_timeout = 60s


#------------------------------------------------------------------------------
# WAL E CHECKPOINTS
#
# Dimensionado para a janela de escrita do sync (milhares de upserts em lote):
# WAL grande espalha o checkpoint no tempo em vez de dar picos de I/O.
#------------------------------------------------------------------------------

wal_buffers = 64MB
min_wal_size = 2GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on


#------------------------------------------------------------------------------
# AUTOVACUUM
#
# O sync faz upsert dos mesmos registros todo dia. Cada UPDATE cria uma tupla
# morta, e tabela inchada = leitura lenta. Os defaults são conservadores
# demais para esse padrão.
#------------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# Default 0.2 (20% da tabela morta antes de limpar). 5% mantém a tabela enxuta.
autovacuum_vacuum_scale_factor = 0.05

# Estatística fresca logo após o sync é o que garante plano bom na manhã seguinte.
autovacuum_analyze_scale_factor = 0.02

# Default 200 foi feito para disco mecânico e deixa o autovacuum lento demais
# para acompanhar o volume do sync.
autovacuum_vacuum_cost_limit = 2000


#------------------------------------------------------------------------------
# OBSERVABILIDADE
#
# Sem isso não há como saber qual query custa 2 minutos. pg_stat_statements
# acumula o ranking; auto_explain grava o plano de execução das lentas.
#------------------------------------------------------------------------------

shared_preload_libraries = 'pg_stat_statements,auto_explain'

pg_stat_statements.max = 10000
pg_stat_statements.track = all

auto_explain.log_min_duration = 3s
auto_explain.log_analyze = on
# log_timing instrumenta cada nó do plano e custa caro; log_analyze sem ele
# ainda dá a contagem real de linhas, que é o que revela estimativa ruim.
auto_explain.log_timing = off
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on

track_io_timing = on
track_activity_query_size = 4096

log_min_duration_statement = 2000
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 0
# Registra todo arquivo temporário: é o sintoma de work_mem pequeno demais.
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

log_timezone = 'America/Sao_Paulo'
timezone = 'America/Sao_Paulo'


#------------------------------------------------------------------------------
# Sobrescritas locais (opcional). Não falha se o arquivo não existir.
#------------------------------------------------------------------------------
include_if_exists = '/etc/postgresql/local.conf'
