; Tuning para 8 vCPU / 24 GB, container php limitado a 3 CPUs / 2560M
; (docker-compose.prod.yml). O teto real é a memória, não a CPU: cada
; worker pode chegar a memory_limit (256M em zz-custom.ini), mas o uso
; típico de um request Laravel fica bem abaixo disso. pm.max_children é um
; limite de segurança contra pico, não a expectativa de uso constante.
[www]
listen = 9000
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000

; Amostra periódica de tempo de resposta por slot, sem custo perceptível.
; Ajuda a decidir se pm.max_children precisa subir (ver /status).
pm.status_path = /fpm-status
ping.path = /fpm-ping
